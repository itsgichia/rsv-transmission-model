[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsvmodel"
version = "0.1.0"
description = "Age-structured SEIRS model of RSV transmission for comparing infant immunisation strategies"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gichia Muiruri" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/itsgichia/rsv-transmission-model"
"Live model" = "https://gichia-portfolio.vercel.app/lab/rsv"

[project.scripts]
rsvmodel = "rsvmodel.cli:main"

[tool.setuptools]
packages = ["rsvmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
